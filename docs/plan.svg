<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">CodeStories learner journey and wireframes</title>
  <desc id="description">A diagram showing how learners choose a track, learn through prediction, explore in 3D or 2D, and review with feedback, plus desktop, mobile, and review-screen wireframes.</desc>
  <style>
    .bg{fill:#f6f8f3}.title{font:800 36px Arial,sans-serif;fill:#17231f}.sub{font:16px Arial,sans-serif;fill:#61736a}.label{font:700 18px Arial,sans-serif;fill:#17231f}.body{font:14px Arial,sans-serif;fill:#43534b}.small{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#35745c}.card{fill:#fff;stroke:#cfdcd1;stroke-width:2}.mint{fill:#e3f5e7;stroke:#69a97b;stroke-width:2}.yellow{fill:#fff1c9;stroke:#d4a437;stroke-width:2}.purple{fill:#eeeafb;stroke:#8d80c0;stroke-width:2}.coral{fill:#fde6df;stroke:#d77f64;stroke-width:2}.line{stroke:#547767;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#98aaa1;stroke-width:2;stroke-dasharray:7 7;fill:none}.screen{fill:#fff;stroke:#17231f;stroke-width:3}.bar{fill:#17231f}.stage{fill:#edf6ee;stroke:#7ba889;stroke-width:2}.chip{fill:#e3f5e7}.white{font:700 12px Arial,sans-serif;fill:#fff}.lineText{font:700 12px Arial,sans-serif;fill:#35745c}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#547767"/></marker></defs>
  <rect class="bg" width="1600" height="1180"/>
  <text class="title" x="65" y="70">CodeStories · learner-first review</text>
  <text class="sub" x="65" y="101">The learner thinks, predicts, explains, and transfers before calling a lesson complete.</text>

  <text class="small" x="65" y="157">THE LEARNING JOURNEY</text>
  <rect class="mint" x="65" y="180" width="205" height="112" rx="14"/><text class="label" x="88" y="215">1. Choose a track</text><text class="body" x="88" y="243">LeetCode or System Design</text><text class="body" x="88" y="266">Outcome + start level</text>
  <rect class="yellow" x="330" y="180" width="205" height="112" rx="14"/><text class="label" x="353" y="215">2. Learn</text><text class="body" x="353" y="243">Worked example first</text><text class="body" x="353" y="266">Just-needed foundation</text>
  <rect class="purple" x="595" y="180" width="205" height="112" rx="14"/><text class="label" x="618" y="215">3. Predict</text><text class="body" x="618" y="243">Pause before the move</text><text class="body" x="618" y="266">No timed pressure</text>
  <rect class="coral" x="860" y="180" width="205" height="112" rx="14"/><text class="label" x="883" y="215">4. Reveal why</text><text class="body" x="883" y="243">Visual + explanation</text><text class="body" x="883" y="266">Common mistakes named</text>
  <rect class="mint" x="1125" y="180" width="205" height="112" rx="14"/><text class="label" x="1148" y="215">5. Transfer</text><text class="body" x="1148" y="243">Fresh input or scenario</text><text class="body" x="1148" y="266">Explain the reasoning</text>
  <path class="line" d="M270 236H330"/><path class="line" d="M535 236H595"/><path class="line" d="M800 236H860"/><path class="line" d="M1065 236H1125"/>
  <path class="line" d="M1228 292V340H700V316"/><text class="lineText" x="837" y="333">Review missed concept or continue</text>

  <text class="small" x="65" y="400">ONE WORKSPACE, THREE PURPOSES</text>
  <rect class="card" x="65" y="425" width="390" height="135" rx="14"/><text class="label" x="90" y="461">Learn · beginner default</text><text class="body" x="90" y="490">One focal concept, one meaningful visual change,</text><text class="body" x="90" y="512">one next action. Code and advanced tools stay quiet.</text><text class="small" x="90" y="542">GUIDED 3D OR EQUIVALENT 2D</text>
  <rect class="card" x="505" y="425" width="390" height="135" rx="14"/><text class="label" x="530" y="461">Explore · test the idea</text><text class="body" x="530" y="490">Change k or a request scenario. Inspect state, code,</text><text class="body" x="530" y="512">objects, and paths without changing the answer.</text><text class="small" x="530" y="542">OPTIONAL ORBIT · ZOOM · FOCUS</text>
  <rect class="card" x="945" y="425" width="390" height="135" rx="14"/><text class="label" x="970" y="461">Review · retrieve independently</text><text class="body" x="970" y="490">Hide future values and route highlights. Record</text><text class="body" x="970" y="512">independent answers separately from assisted ones.</text><text class="small" x="970" y="542">HINT · REVIEW CONCEPT · REVEAL</text>

  <text class="small" x="65" y="624">GUIDED DESKTOP WIREFRAME</text>
  <rect class="screen" x="65" y="648" width="800" height="390" rx="12"/>
  <rect class="bar" x="65" y="648" width="800" height="45" rx="12"/><text class="white" x="87" y="676">CodeStories</text><text class="white" x="260" y="676">LEARN</text><text class="white" x="330" y="676">EXPLORE</text><text class="white" x="425" y="676">REVIEW</text><text class="white" x="711" y="676">3D  /  2D</text>
  <rect class="card" x="84" y="715" width="180" height="295" rx="8"/><text class="small" x="101" y="744">LEETCODE · PATTERNS</text><text class="label" x="101" y="777">Sliding Window</text><text class="body" x="101" y="808">Available now</text><text class="body" x="101" y="842">Two Pointers</text><text class="body" x="101" y="868">Roadmap</text><text class="body" x="101" y="902">Other patterns</text><text class="sub" x="101" y="928">Planned</text>
  <rect class="stage" x="284" y="715" width="362" height="295" rx="8"/><text class="small" x="301" y="744">STEP 2 OF 6 · PREDICT</text><rect class="yellow" x="327" y="826" width="52" height="52" rx="7"/><rect class="yellow" x="388" y="826" width="52" height="52" rx="7"/><rect class="card" x="449" y="826" width="52" height="52" rx="7"/><rect class="card" x="510" y="826" width="52" height="52" rx="7"/><text class="label" x="345" y="858">2</text><text class="label" x="406" y="858">4</text><text class="label" x="467" y="858">6</text><text class="label" x="528" y="858">8</text><text class="body" x="320" y="914">Before sliding: which value leaves, which enters?</text><rect class="bar" x="409" y="948" width="110" height="35" rx="6"/><text class="white" x="430" y="971">Reveal →</text>
  <rect class="card" x="666" y="715" width="180" height="295" rx="8"/><text class="small" x="683" y="744">WHY THIS WORKS</text><text class="label" x="683" y="778">Keep overlap</text><text class="body" x="683" y="810">Remove 2</text><text class="body" x="683" y="834">Keep 4</text><text class="body" x="683" y="858">Add 6</text><path class="dash" d="M683 882H826"/><text class="body" x="683" y="908">Invariant:</text><text class="body" x="683" y="930">window has k values</text><text class="sub" x="683" y="970">Show code ▸</text>

  <text class="small" x="920" y="624">MOBILE: KEEP THE NEXT ACTION VISIBLE</text>
  <rect class="screen" x="920" y="648" width="310" height="390" rx="25"/><rect class="bar" x="920" y="648" width="310" height="44" rx="25"/><text class="white" x="943" y="676">←  Sliding Window</text><text class="white" x="1148" y="676">2D</text>
  <text class="small" x="943" y="724">PREDICT THE NEXT MOVE</text><rect class="stage" x="943" y="744" width="264" height="135" rx="8"/><rect class="yellow" x="966" y="785" width="42" height="42" rx="5"/><rect class="yellow" x="1017" y="785" width="42" height="42" rx="5"/><rect class="card" x="1068" y="785" width="42" height="42" rx="5"/><text class="body" x="955" y="856">What leaves the window?</text>
  <rect class="card" x="943" y="897" width="264" height="65" rx="8"/><text class="body" x="958" y="923">A. 2 leaves; 6 enters</text><text class="body" x="958" y="946">B. 4 leaves; 6 enters</text><rect class="bar" x="1006" y="978" width="138" height="35" rx="6"/><text class="white" x="1021" y="1001">Check answer</text>

  <text class="small" x="1285" y="624">REVIEW: FEEDBACK, NOT A MASTERY BADGE</text>
  <rect class="screen" x="1285" y="648" width="255" height="390" rx="12"/><text class="small" x="1305" y="680">REVIEW · 2 OF 4</text><text class="label" x="1305" y="720">Cache miss:</text><text class="label" x="1305" y="744">what happens next?</text><rect class="card" x="1305" y="770" width="215" height="42" rx="6"/><text class="body" x="1318" y="796">Return cached data</text><rect class="coral" x="1305" y="820" width="215" height="42" rx="6"/><text class="body" x="1318" y="846">Read Timeline DB</text><text class="small" x="1305" y="890">WHY THIS MATTERS</text><text class="body" x="1305" y="914">A miss means metadata</text><text class="body" x="1305" y="934">is not cached; the DB</text><text class="body" x="1305" y="954">remains source of truth.</text><text class="sub" x="1305" y="987">Help used · review again</text><rect class="bar" x="1305" y="1000" width="128" height="27" rx="5"/><text class="white" x="1318" y="1019">Back to lesson</text>
  <text class="sub" x="65" y="1128">Two completed lessons · 12 flashcards · 8 unique questions · browser-local progress · no accounts or mastery claim</text>
</svg>
